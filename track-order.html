<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Your Order - Global Fashion</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            line-height: 1.6;
        }
        
        /* Header */
        header {
            background: white;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-align: center;
        }
        header h1 {
            font-size: 1.8rem;
            color: #111827;
        }
        header p {
            color: #6b7280;
            margin-top: 5px;
        }
        .back-link {
            display: inline-block;
            margin-top: 10px;
            color: #4f46e5;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover { text-decoration: underline; }

        /* Main Container */
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Search Form */
        .search-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
        .search-box h2 {
            margin-bottom: 15px;
            color: #111827;
        }
        .search-box p {
            color: #6b7280;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        .input-group input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
        }
        .input-group input:focus {
            outline: none;
            border-color: #4f46e5;
        }
        .search-btn {
            padding: 12px 30px;
            background: #111827;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-btn:hover { background: #374151; }
        .search-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        /* Results */
        .results {
            display: none;
        }
        .results.active {
            display: block;
        }
        .no-orders {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            color: #6b7280;
        }
        .no-orders h3 {
            color: #111827;
            margin-bottom: 10px;
        }

        /* Order Card */
        .order-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            overflow: hidden;
        }
        .order-header {
            background: #f9fafb;
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .order-id {
            font-size: 1.1rem;
            font-weight: bold;
            color: #111827;
        }
        .order-date {
            color: #6b7280;
            font-size: 0.9rem;
        }
        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: capitalize;
        }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-paid { background: #dbeafe; color: #1e40af; }
        .status-shipped { background: #e0e7ff; color: #3730a3; }
        .status-delivered { background: #d1fae5; color: #065f46; }
        .status-cancelled { background: #fee2e2; color: #991b1b; }

        .order-body {
            padding: 20px;
        }
        .order-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f3f4f6;
        }
        .info-item h4 {
            color: #6b7280;
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .info-item p {
            color: #111827;
            font-weight: 600;
        }

        .items-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #111827;
        }
        .order-item {
            display: flex;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid #f9fafb;
        }
        .order-item:last-child {
            border-bottom: none;
        }
        .order-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }
        .item-details {
            flex: 1;
        }
        .item-details h5 {
            margin-bottom: 5px;
            color: #111827;
        }
        .item-details p {
            color: #6b7280;
            font-size: 0.9rem;
            margin: 3px 0;
        }
        .item-price {
            font-weight: bold;
            color: #059669;
            font-size: 1.1rem;
        }

        .order-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: #f9fafb;
            border-top: 1px solid #e5e7eb;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .total-amount {
            color: #059669;
            font-size: 1.4rem;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <header>
        <h1>📦 Track Your Order</h1>
        <p>Enter your email to see your order status</p>
        <a href="index.html" class="back-link">← Back to Store</a>
    </header>

    <div class="container">
        <!-- Search Form -->
        <div class="search-box">
            <h2>Find Your Order</h2>
            <p>Enter the email address you used when placing your order.</p>
            <div class="input-group">
                <input type="email" id="email-input" placeholder="your@email.com" onkeypress="if(event.key==='Enter') searchOrders()">
                <button class="search-btn" onclick="searchOrders()">Track Order</button>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="loading" style="display:none;">
            Searching for your orders...
        </div>

        <!-- Results -->
        <div id="results" class="results">
            <div id="orders-container"></div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://qtszfqwojgzyypxybgug.supabase.co'
        const supabaseKey = 'sb_publishable_ju-FVpTSui3d4b5Ab0L3HA_sklq66Ut'
        const { createClient } = supabase
        const db = createClient(supabaseUrl, supabaseKey)

        async function searchOrders() {
            const email = document.getElementById('email-input').value.trim()
            
            if (!email) {
                alert('Please enter your email address.')
                return
            }

            // Show loading
            document.getElementById('loading').style.display = 'block'
            document.getElementById('results').classList.remove('active')

            // Query Supabase for orders with this email
            const { data, error } = await db
                .from('orders')
                .select(`
                    *,
                    order_items (
                        quantity,
                        price_at_purchase,
                        products (
                            name,
                            image_url,
                            category
                        )
                    )
                `)
                .eq('customer_email', email)
                .order('created_at', { ascending: false })

            // Hide loading
            document.getElementById('loading').style.display = 'none'
            document.getElementById('results').classList.add('active')

            if (error) {
                console.error(error)
                document.getElementById('orders-container').innerHTML = `
                    <div class="no-orders">
                        <h3>Error</h3>
                        <p>There was an error searching for your orders. Please try again.</p>
                    </div>
                `
                return
            }

            if (data.length === 0) {
                document.getElementById('orders-container').innerHTML = `
                    <div class="no-orders">
                        <h3>No Orders Found</h3>
                        <p>We couldn't find any orders with the email <strong>${email}</strong></p>
                        <p style="margin-top: 10px;">Make sure you're using the same email you used when placing your order.</p>
                    </div>
                `
                return
            }

            // Render orders
            document.getElementById('orders-container').innerHTML = data.map(order => {
                const orderDate = new Date(order.created_at).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                })

                const itemsHtml = order.order_items.map(item => {
                    const product = item.products || {}
                    return `
                        <div class="order-item">
                            <img src="${product.image_url || 'https://via.placeholder.com/80'}" alt="${product.name || 'Product'}">
                            <div class="item-details">
                                <h5>${product.name || 'Unknown Product'}</h5>
                                <p>Category: ${product.category || 'N/A'}</p>
                                <p>Quantity: ${item.quantity}</p>
                                <p class="item-price">$${item.price_at_purchase} each</p>
                            </div>
                        </div>
                    `
                }).join('')

                const statusClass = `status-${order.status}`

                return `
                    <div class="order-card">
                        <div class="order-header">
                            <div>
                                <div class="order-id">Order #${order.id.substring(0, 8).toUpperCase()}</div>
                                <div class="order-date">Placed on ${orderDate}</div>
                            </div>
                            <span class="status-badge ${statusClass}">${order.status}</span>
                        </div>
                        
                        <div class="order-body">
                            <div class="order-info">
                                <div class="info-item">
                                    <h4>Shipping Address</h4>
                                    <p>${order.shipping_address}</p>
                                </div>
                                <div class="info-item">
                                    <h4>Customer</h4>
                                    <p>${order.customer_name}</p>
                                </div>
                            </div>

                            <h4 class="items-title">Items Ordered</h4>
                            ${itemsHtml}
                        </div>

                        <div class="order-total">
                            <span>Total Amount:</span>
                            <span class="total-amount">$${parseFloat(order.total_amount).toFixed(2)}</span>
                        </div>
                    </div>
                `
            }).join('')
        }
    </script>
</body>
</html>
