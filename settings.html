<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Settings</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f5f5f5; color: #333; padding-bottom: 70px; }
        a { text-decoration: none; color: inherit; }
        .app-container { max-width: 480px; margin: 0 auto; background: #f5f5f5; min-height: 100vh; position: relative; }
        
        /* Header */
        .header { background: #fff; padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 100; }
        .back-btn { font-size: 20px; margin-right: 15px; cursor: pointer; }
        .header h2 { font-size: 18px; font-weight: bold; flex: 1; text-align: center; margin-right: 35px; }
        
        /* Settings List */
        .settings-list { background: #fff; margin-top: 10px; }
        .setting-item { display: flex; align-items: center; padding: 15px 20px; border-bottom: 1px solid #f5f5f5; cursor: pointer; }
        .setting-item:active { background: #f9f9f9; }
        .setting-icon { font-size: 20px; width: 30px; text-align: center; margin-right: 15px; }
        .setting-text { flex: 1; font-size: 15px; }
        .setting-arrow { color: #ccc; font-size: 14px; }
        
        .logout-btn { background: #e62e2d; color: white; text-align: center; padding: 15px; margin: 20px 10px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #fff; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 8px 0; z-index: 100; }
        .nav-item { text-align: center; color: #999; font-size: 10px; }
        .nav-item.active { color: #e62e2d; }
        .nav-icon { font-size: 22px; margin-bottom: 2px; }
    </style>
</head>
<body>
<div class="app-container">
    <!-- Header -->
    <div class="header">
        <a href="account.html" class="back-btn">‹</a>
        <h2>Settings</h2>
    </div>

    <!-- Settings Menu -->
    <div class="settings-list">
        <div class="setting-item" onclick="alert('Edit Profile coming soon!')">
            <span class="setting-icon">👤</span>
            <span class="setting-text">Edit Profile</span>
            <span class="setting-arrow">›</span>
        </div>
        <div class="setting-item" onclick="alert('Notifications coming soon!')">
            <span class="setting-icon">🔔</span>

        </div>
        <div class="setting-item" onclick="alert('Privacy Policy coming soon!')">
            <span class="setting-icon">🔒</span>
            <span class="setting-text">Privacy Policy</span>
            <span class="setting-arrow">›</span>
        </div>
        <div class="setting-item" onclick="alert('Terms of Service coming soon!')">
            <span class="setting-icon"></span>
            <span class="setting-text">Terms of Service</span>
            <span class="setting-arrow">›</span>
        </div>
        <div class="setting-item" onclick="alert('About Us coming soon!')">
            <span class="setting-icon">ℹ️</span>
            <span class="setting-text">About Us</span>
            <span class="setting-arrow">›</span>
        </div>
        <a href="messages.html" class="setting-item">
            <span class="setting-icon"></span>
            <span class="setting-text">Help & Support</span>
            <span class="setting-arrow">›</span>
        </a>
    </div>

    <!-- Log Out Button -->
    <div class="logout-btn" id="logout-btn" onclick="handleLogout()">Log Out</div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
    <a href="index.html" class="nav-item"><div class="nav-icon">🏠</div><div>Home</div></a>
    <a href="category.html" class="nav-item"><div class="nav-icon"></div><div>Category</div></a>
    <a href="messages.html" class="nav-item"><div class="nav-icon">💬</div><div>Message</div></a>

    <a href="account.html" class="nav-item"><div class="nav-icon"></div><div>Account</div></a>
</div>

<script>
    const supabaseUrl = 'https://qtszfqwojgzyypxybgug.supabase.co'
    const supabaseKey = 'sb_publishable_ju-FVpTSui3d4b5Ab0L3HA_sklq66Ut'

</body>
</html>
